<style>
:root{--blue:#0072B2;--ink:#1F2933;--sub:#52606D;--line:#D9E2EC}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
header{padding:20px 16px 8px;border-top:6px solid var(--blue)}
h1{font-size:20px;margin:0 0 4px}
p.meta{margin:0;font-size:14px;color:var(--sub)}
.dl{display:inline-block;margin:12px 0 4px;padding:12px 18px;border:2px solid var(--blue);border-radius:10px;color:var(--blue);font-weight:700;text-decoration:none;font-size:16px}
main{padding:8px 12px 40px;max-width:900px;margin:0 auto}
figure{margin:16px 0}
figure img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px}
figcaption{font-size:13px;color:var(--sub);margin-top:4px}
footer{padding:0 16px 32px;font-size:13px;color:var(--sub);text-align:center}

figure img{cursor:zoom-in}
#vw{position:fixed;inset:0;background:#10151a;display:none;z-index:10;touch-action:pan-x pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
#vw.on{display:block}
#vw img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border:0;border-radius:0;cursor:default}
#vw .bar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:#fff;font-size:16px;pointer-events:none;z-index:2}#vw .bar>*{pointer-events:auto}#cnt{background:#000a;padding:8px 14px;border-radius:10px}
#vw button{font:inherit;color:#fff;background:#ffffff26;border:1px solid #ffffff55;border-radius:10px;padding:10px 16px;min-width:56px;min-height:44px}
#vw .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;padding:22px 12px;font-size:22px}
#vw .prev{left:6px}#vw .next{right:6px}
#vw .hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#ffffffbb;font-size:13px;z-index:2}
</style></head><body>

</header>
<main>

<div id="vw" aria-hidden="true">
<div class="bar"><span id="cnt">1 / 11</span><button id="x" type="button">閉じる</button></div>
<img id="big" alt="">
<button class="nav prev" id="pv" type="button" aria-label="前のスライド">◀</button>
<button class="nav next" id="nx" type="button" aria-label="次のスライド">▶</button>
<div class="hint">左右スワイプ／◀▶で移動　ピンチで拡大</div>
</div>
<script>
(function(){
var imgs=[].slice.call(document.querySelectorAll('figure img'));
var N=imgs.length,i=0,vw=document.getElementById('vw'),big=document.getElementById('big'),cnt=document.getElementById('cnt');
function show(n){
  i=(n+N)%N; big.src=imgs[i].getAttribute('data-full'); big.alt=imgs[i].alt;
  cnt.textContent=(i+1)+' / '+N;
  [i+1,i-1].forEach(function(k){var p=new Image();p.src=imgs[(k+N)%N].getAttribute('data-full');});
  try{history.replaceState(null,'','#'+(i+1));}catch(e){}
}
function open(n){show(n);vw.classList.add('on');vw.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
function close(){vw.classList.remove('on');vw.setAttribute('aria-hidden','true');document.body.style.overflow='';}
imgs.forEach(function(im,k){
  im.addEventListener('click',function(){open(k);});
  im.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open(k);}});
});
document.getElementById('x').onclick=close;
document.getElementById('pv').onclick=function(e){e.stopPropagation();show(i-1);};
document.getElementById('nx').onclick=function(e){e.stopPropagation();show(i+1);};
document.addEventListener('keydown',function(e){
  if(!vw.classList.contains('on'))return;
  if(e.key==='ArrowLeft')show(i-1); else if(e.key==='ArrowRight'||e.key===' ')show(i+1); else if(e.key==='Escape')close();
});
var sx=0,sy=0,multi=false;
vw.addEventListener('touchstart',function(e){multi=e.touches.length>1;if(!multi){sx=e.touches[0].clientX;sy=e.touches[0].clientY;}},{passive:true});
vw.addEventListener('touchmove',function(e){if(e.touches.length>1)multi=true;},{passive:true});
vw.addEventListener('touchend',function(e){
  var z=window.visualViewport?window.visualViewport.scale:1;
  if(multi||z>1.05||e.changedTouches.length!==1)return;
  var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){show(dx<0?i+1:i-1);}
},{passive:true});
var h=parseInt((location.hash||'').slice(1),10);
if(h>=1&&h<=N)open(h-1);
})();
</script>
