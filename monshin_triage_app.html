<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0072B2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>生活についての質問（トリアージ版）— 旭川赤十字病院 血液腫瘍内科</title>
<style>
/* ===== Wong colorblind-safe palette（確定事項） ===== */
:root{
  --blue:#0072B2; --amber:#E69F00; --teal:#009E73; --verm:#D55E00; --pink:#CC79A7;
  --ink:#1a1a1a; --sub:#555; --line:#d9d9d9; --bg:#ffffff; --panel:#f5f7fa;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:20px; line-height:1.6;}
#app{max-width:820px;margin:0 auto;padding:16px 20px 48px;min-height:100vh;display:flex;flex-direction:column;}

.hdr{display:flex;align-items:center;gap:12px;padding:8px 0 14px;border-bottom:3px solid var(--blue);margin-bottom:18px;}
.hdr .sec{font-size:22px;font-weight:700;color:var(--blue);}
.hdr .dots{margin-left:auto;display:flex;gap:6px;}
.hdr .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--blue);background:#fff;transition:background .4s ease, transform .3s ease;}
.hdr .dot.on{background:var(--blue);}
.hdr .dot.cur{transform:scale(1.35);}
.banner{background:#fdf3e0;border:2px solid var(--amber);border-radius:12px;padding:10px 14px;font-size:18px;margin-bottom:16px;}
.banner b{color:#8a5b00;}

.qtext{font-size:28px;font-weight:700;margin:10px 0 6px;}
.qhelp{font-size:19px;color:var(--sub);margin-bottom:18px;}
.btn{display:block;width:100%;min-height:64px;font-size:23px;font-weight:700;
  border-radius:14px;border:3px solid var(--line);background:#fff;color:var(--ink);
  padding:14px 18px;margin:12px 0;text-align:left;cursor:pointer;
  transition:transform .12s ease, background .15s ease, border-color .15s ease;}
.btn:active{transform:scale(.985);background:var(--panel);}
.btn .num{display:inline-block;width:38px;height:38px;line-height:34px;text-align:center;border-radius:50%;
  border:3px solid var(--blue);color:var(--blue);margin-right:14px;font-size:20px;vertical-align:middle;}
.btn.o2 .num{border-color:var(--amber);color:#8a5b00;}
.btn.o3 .num{border-color:var(--verm);color:var(--verm);}
.btn.o4 .num{border-color:var(--pink);color:var(--pink);}
.btn.sel{border-color:var(--blue);background:#e8f2fa;}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);text-align:center;}
.btn.secondary{background:#fff;color:var(--blue);border-color:var(--blue);text-align:center;}
.btn.small{min-height:52px;font-size:19px;}
.btn:disabled{opacity:.4;}
.row2{display:flex;gap:12px;}
.row2 .btn{flex:1;}
.footer-nav{margin-top:auto;padding-top:22px;display:flex;gap:12px;}
.linkbtn{background:none;border:none;color:var(--sub);font-size:17px;text-decoration:underline;cursor:pointer;padding:10px;}
.speak{background:#fff;border:2px solid var(--teal);color:var(--teal);border-radius:10px;
  font-size:17px;font-weight:700;padding:8px 14px;cursor:pointer;margin-bottom:10px;}

.chk{display:flex;align-items:center;gap:14px;}
.chk .box{width:34px;height:34px;border:3px solid var(--blue);border-radius:8px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;background:#fff;}
.chk.sel .box{background:var(--blue);}
.chk.sel{border-color:var(--blue);background:#e8f2fa;}

/* ===== やさしいアニメーション（認知評価中は停止） ===== */
.fade{animation:fadein .3s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.04);}100%{transform:scale(1);}}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes bloom{0%{transform:scale(.3);opacity:0;}70%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}
@keyframes flipIn{from{opacity:0;transform:perspective(600px) rotateY(80deg);}to{opacity:1;transform:none;}}
.btn.picked{animation:pop .3s ease;border-color:var(--blue);background:#e8f2fa;}
.fade .btn{animation:riseIn .35s ease backwards;}
.fade .btn:nth-of-type(1){animation-delay:.05s;} .fade .btn:nth-of-type(2){animation-delay:.12s;}
.fade .btn:nth-of-type(3){animation-delay:.19s;} .fade .btn:nth-of-type(4){animation-delay:.26s;}
.fade .btn:nth-of-type(5){animation-delay:.33s;} .fade .btn:nth-of-type(6){animation-delay:.40s;}
.qicon{font-size:60px;text-align:center;margin:0 0 6px;animation:floaty 3.5s ease-in-out infinite;}
.bigcheck{font-size:64px;color:var(--teal);text-align:center;margin:20px 0 6px;animation:bloom .6s ease;}
.wordcard{display:inline-block;min-width:160px;margin:10px;padding:26px 18px;border:3px solid var(--blue);
  border-radius:16px;font-size:34px;font-weight:800;text-align:center;background:#fff;}
.wordcard.reveal{animation:flipIn .5s ease backwards;}
.noanim .fade{animation:none;}
.noanim .fade .btn,.noanim .qicon{animation:none;}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

#clockwrap{border:3px solid var(--ink);border-radius:8px;background:#fff;touch-action:none;}
canvas{display:block;background:#fff;}

.spanel{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0;font-size:18px;}
.spanel h3{margin:0 0 8px;font-size:20px;color:var(--blue);border-bottom:2px solid var(--line);padding-bottom:4px;}
table.sm{width:100%;border-collapse:collapse;font-size:17px;}
table.sm th,table.sm td{border:1px solid var(--line);padding:6px 8px;text-align:left;background:#fff;}
table.sm th{background:#eef3f8;}
.alert{display:flex;gap:10px;align-items:flex-start;border:3px solid var(--verm);background:#fdf0e8;
  border-radius:10px;padding:10px 12px;margin:8px 0;font-size:18px;font-weight:600;}
.alert .ic{font-size:22px;flex:none;}
.info{display:flex;gap:10px;align-items:flex-start;border:3px solid var(--teal);background:#e9f7f2;
  border-radius:10px;padding:10px 12px;margin:8px 0;font-size:18px;}
.warnbox{border:3px solid var(--amber);background:#fdf3e0;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:18px;font-weight:600;}
.modebox{border:3px solid var(--blue);background:#e8f2fa;border-radius:10px;padding:10px 14px;margin:8px 0;font-size:19px;font-weight:700;}
pre.payload{font-size:13px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;}
input[type=text],input[type=url],input[type=password],select{width:100%;font-size:22px;padding:12px;border:3px solid var(--line);border-radius:10px;margin:6px 0 14px;background:#fff;}
label.fl{font-size:18px;font-weight:700;color:var(--sub);}
.center{text-align:center;}
.affil{font-size:15px;color:var(--sub);text-align:center;margin-top:18px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   高齢DLBCL 患者・家族入力型 問診アプリ【トリアージ版】（方式B）
   旭川赤十字病院 血液腫瘍内科

   「全員に全部聞く」→「必要な人に必要な深さだけ聞く」
   ┌──────────┬─────────┬───────────────────┬──────────────────────────────┐
   │ モード    │ 所要時間 │ 対象               │ 内容                          │
   ├──────────┼─────────┼───────────────────┼──────────────────────────────┤
   │ 超短縮    │ 1〜2分  │ 全例               │ 6問トリアージ                  │
   │ 標準      │ 3〜5分  │ 何か引っかかった人  │ ADL/IADL要点・栄養・服薬・     │
   │          │         │                    │ 通院・生活背景                 │
   │ 詳細      │ 7〜10分 │ 85歳以上／認知懸念／│ Mini-Cog・詳細ADL/IADL・       │
   │          │         │ 支援不足           │ 生活背景全項目                 │
   └──────────┴─────────┴───────────────────┴──────────────────────────────┘
   - 判定は自動（医療者が上書き可能）。患者にはモード名・分類を表示しない
   - 方式B：研究ID＋問診データのみ送信。3択元値保持・sGA時のみ2値化
   - GAS保存プロキシは monshin_gas_proxy.gs をそのまま使用可（動的ヘッダー）
===================================================================== */

var LSKEY = 'monshinTriage_settings_v1';
var APP_VERSION = 'triage-B-1.2';

/* ---------------- 状態 ---------------- */
var S = {
  researchId:'', gasUrl:'', staffCode:'0000',
  ageBand:'', modeOverride:'auto',    // auto | short | standard | detail
  mode:null,                          // 入力者: self | family | staff | both
  raw:{}, iadlReason:{}, ext:{}, cogMulti:{},
  acuteSymptoms:[], acuteTiming:null,
  mc:{skipped:false, wordset:null, words:[], recall:[false,false,false], clock:null, redoUsed:false, done:false},
  staffMemo:'', idx:0, hist:[], sent:false,
  timing:{startMs:null, lastMs:null, lastKey:null, perSec:{}}   // 所要時間（②）
};
(function loadSettings(){
  try{
    var s = JSON.parse(localStorage.getItem(LSKEY)||'{}');
    if(s.gasUrl) S.gasUrl = s.gasUrl;
    if(s.staffCode) S.staffCode = s.staffCode;
  }catch(e){}
})();
function saveSettings(){
  try{ localStorage.setItem(LSKEY, JSON.stringify({gasUrl:S.gasUrl, staffCode:S.staffCode})); }catch(e){}
}

/* ---------------- 6問トリアージ ---------------- */
var TRIAGE = [
  {id:'ext_triage_q1', domain:'adl', flagOn:['no','unknown'],
   qs:'病気で悪くなる前、身の回りのこと（入浴・着替え・トイレなど）は、ひとりでできていましたか？',
   qf:'病気で悪くなる前、患者さんは身の回りのことをひとりでできていましたか？',
   icon:'🛁',
   opts:[{v:'yes',t:'できていた',cls:''},{v:'no',t:'手伝いが必要だった',cls:'o3'},{v:'unknown',t:'わからない',cls:'o4'}]},
  {id:'ext_triage_q2', domain:'iadl', flagOn:['yes','unknown'],
   qs:'病気で悪くなる前から、薬の管理・通院・買い物・お金の管理のどれかに、支援が必要でしたか？',
   qf:'病気で悪くなる前から、患者さんは薬の管理・通院・買い物・お金の管理のどれかに支援が必要でしたか？',
   icon:'💊',
   opts:[{v:'no',t:'必要なかった',cls:''},{v:'yes',t:'支援が必要だった',cls:'o3'},{v:'unknown',t:'わからない',cls:'o4'}]},
  {id:'ext_triage_q3', domain:'nut', flagOn:['yes','unknown'],
   qs:'最近3か月で、食事の量が減ったり、体重が減ったりしましたか？',
   qf:'最近3か月で、患者さんの食事の量や体重が減りましたか？',
   icon:'⚖️',
   opts:[{v:'no',t:'変わらない',cls:''},{v:'yes',t:'減った',cls:'o3'},{v:'unknown',t:'わからない',cls:'o4'}]},
  {id:'ext_triage_q4', domain:'cog', flagOn:['yes','unknown'],
   qs:'もの忘れや、判断に不安がありますか？',
   qf:'患者さんのもの忘れや判断に、心配なことはありますか？',
   icon:'💭',
   opts:[{v:'no',t:'ない',cls:''},{v:'yes',t:'ある・心配なことがある',cls:'o3'},{v:'unknown',t:'わからない',cls:'o4'}]},
  {id:'ext_triage_q5', domain:'soc', flagOn:['yes','unknown'],
   qs:'ひとり暮らし、または通院を手伝ってくれる人がいない状況ですか？',
   qf:'患者さんは、ひとり暮らし、または通院を手伝える人がいない状況ですか？',
   icon:'🏠',
   opts:[{v:'no',t:'いいえ（支えてくれる人がいる）',cls:''},{v:'yes',t:'はい（あてはまる）',cls:'o3'},{v:'unknown',t:'わからない',cls:'o4'}]},
  {id:'ext_triage_q6', domain:'acute', flagOn:['yes','unknown'],
   qs:'最近1〜2か月で、急に歩けなくなった・寝ている時間が増えた・発熱が続く、などはありますか？',
   qf:'最近1〜2か月で、患者さんに急な変化（歩けない・寝ている時間が増えた・発熱が続く など）はありますか？',
   icon:'📈',
   opts:[{v:'no',t:'ない',cls:''},{v:'yes',t:'ある',cls:'o3'},{v:'unknown',t:'わからない',cls:'o4'}]}
];
function triageFlag(domain){
  var t = TRIAGE.filter(function(x){return x.domain===domain;})[0];
  var v = S.ext[t.id];
  return v!=null && t.flagOn.indexOf(v)>=0;
}
function anyFlag(){
  return TRIAGE.some(function(t){ var v=S.ext[t.id]; return v!=null && t.flagOn.indexOf(v)>=0; });
}
/* モード判定：85歳以上・認知懸念・支援不足 → 詳細／何か該当 → 標準／該当なし → 超短縮 */
function modeAuto(){
  if(S.ageBand==='85+' || triageFlag('cog') || triageFlag('soc')) return 'detail';
  if(anyFlag()) return 'standard';
  return 'short';
}
function modeFinal(){
  return (S.modeOverride && S.modeOverride!=='auto') ? S.modeOverride : modeAuto();
}
function modeReasons(){
  var r = [];
  if(S.ageBand==='85+') r.push('85歳以上');
  if(triageFlag('cog')) r.push('認知懸念（Q4）');
  if(triageFlag('soc')) r.push('支援不足・独居（Q5）');
  if(triageFlag('adl')) r.push('発症前ADL低下（Q1）');
  if(triageFlag('iadl')) r.push('発症前IADL支援（Q2）');
  if(triageFlag('nut')) r.push('食事量・体重減少（Q3）');
  if(triageFlag('acute')) r.push('急性の変化（Q6）');
  return r;
}
var MODE_LABEL = {short:'超短縮（トリアージのみ・1〜2分）', standard:'標準（要点確認・3〜5分）', detail:'詳細（フル評価・7〜10分）'};

/* ---------------- 質問定義（要点＝CORE／詳細追加＝EXT） ---------------- */
var OPT3 = [
  {v:2, t:'ひとりでできる', cls:''},
  {v:1, t:'少し手伝いが必要', cls:'o2'},
  {v:0, t:'ほとんど、または全部手伝いが必要', cls:'o3'}
];
var OPT3I = [
  {v:2, t:'ひとりでできる', cls:''},
  {v:1, t:'一部手伝いがあればできる', cls:'o2'},
  {v:0, t:'できない、または普段していない', cls:'o3'}
];
/* ADL要点3項目（標準）＋残り3項目（詳細） */
var ADL_CORE = [
  {id:'adl_bath', label:'入浴',
   qs:'普段、おふろやシャワーに、ひとりで入れますか？',
   qf:'普段、患者さんは、おふろやシャワーにひとりで入れますか？',
   help:'手すりを使う場合も「ひとりでできる」に含みます。'},
  {id:'adl_toilet', label:'トイレ',
   qs:'普段、トイレでの動作（移動・衣服の上げ下ろし）は、ひとりでできますか？',
   qf:'普段、患者さんは、トイレでの動作をひとりでできますか？'},
  {id:'adl_transfer', label:'移動（ベッド・椅子）',
   qs:'普段、ベッドや布団から起き上がって、椅子に移ることは、ひとりでできますか？',
   qf:'普段、患者さんは、ベッドから椅子への移動をひとりでできますか？',
   help:'杖や手すりを使う場合も「ひとりでできる」に含みます。'}
];
var ADL_EXT = [
  {id:'adl_dress', label:'着替え',
   qs:'普段、服の着替えは、ひとりでできますか？',
   qf:'普段、患者さんは、服の着替えをひとりでできますか？'},
  {id:'adl_continence', label:'排泄',
   qs:'トイレに間に合わず、失敗してしまうことはありますか？',
   qf:'患者さんが、トイレに間に合わず失敗してしまうことはありますか？',
   opts:[{v:2,t:'ほとんどない',cls:''},{v:1,t:'ときどきある',cls:'o2'},{v:0,t:'よくある',cls:'o3'}]},
  {id:'adl_feeding', label:'食事の動作',
   qs:'普段、食事は、ひとりで食べられますか？',
   qf:'普段、患者さんは、食事をひとりで食べられますか？'}
];
/* IADL要点4項目（標準）＋残り4項目（詳細） */
var IADL_CORE = [
  {id:'iadl_shopping', label:'買い物',
   qs:'普段、ご自身で買い物に行けますか？',
   qf:'普段、患者さんは、ご自身で買い物に行けますか？'},
  {id:'iadl_meds', label:'薬の管理',
   qs:'普段、お薬を決められたとおりに、ご自身で飲めていますか？',
   qf:'普段、患者さんは、お薬をご自身で管理して飲めていますか？'},
  {id:'iadl_finance', label:'お金の管理',
   qs:'普段、お金の管理（支払い・銀行など）をご自身でしていますか？',
   qf:'普段、患者さんは、お金の管理をご自身でしていますか？'},
  {id:'iadl_transport', label:'移動・交通',
   qs:'普段、バス・電車・車などで、ひとりで外出できますか？',
   qf:'普段、患者さんは、バス・電車・車などでひとりで外出できますか？'}
];
var IADL_EXT = [
  {id:'iadl_phone', label:'電話・連絡',
   qs:'普段、電話をかけたり、受けたりできますか？',
   qf:'普段、患者さんは、電話をかけたり受けたりできますか？'},
  {id:'iadl_food', label:'食事の準備',
   qs:'普段、ご自身で食事の準備（調理）をしていますか？',
   qf:'普段、患者さんは、ご自身で食事の準備をしていますか？'},
  {id:'iadl_housekeep', label:'家事',
   qs:'普段、掃除などの家事をご自身でしていますか？',
   qf:'普段、患者さんは、掃除などの家事をご自身でしていますか？'},
  {id:'iadl_laundry', label:'洗濯',
   qs:'普段、洗濯をご自身でしていますか？',
   qf:'普段、患者さんは、洗濯をご自身でしていますか？'}
];
var IADL_REASONS = [
  {v:'family_role', t:'もともと家族が担当している', cls:''},
  {v:'physical',    t:'体力的に難しい', cls:'o2'},
  {v:'cognitive',   t:'覚えたり、判断したりが難しい', cls:'o4'},
  {v:'acute',       t:'病気になってから、急に難しくなった', cls:'o3'}
];
/* 栄養要点4（標準）＋詳細追加3 */
var NUT_CORE = [
  {id:'ext_nut_wtloss', label:'体重の変化',
   qs:'最近3か月で、体重はどのくらい減りましたか？', qf:'最近3か月で、患者さんの体重はどのくらい減りましたか？',
   opts:[{v:'none',t:'減っていない',cls:''},{v:'1-3kg',t:'1〜3kgくらい減った',cls:'o2'},{v:'3kg+',t:'3kg以上減った',cls:'o3'},{v:'unknown',t:'わからない',cls:'o4'}]},
  {id:'ext_nut_intake', label:'食事の量',
   qs:'最近、食事の量は減っていますか？', qf:'最近、患者さんの食事の量は減っていますか？',
   opts:[{v:'normal',t:'いつも通り食べている',cls:''},{v:'half',t:'半分くらいに減った',cls:'o2'},{v:'little',t:'ほとんど食べられない',cls:'o3'},{v:'varies',t:'日によって大きく違う',cls:'o4'}]},
  {id:'ext_nut_appetite', label:'食欲',
   qs:'最近、食欲はありますか？', qf:'最近、患者さんに食欲はありますか？',
   opts:[{v:'good',t:'ある',cls:''},{v:'reduced',t:'少し落ちている',cls:'o2'},{v:'poor',t:'ほとんどない',cls:'o3'}]},
  {id:'ext_nut_chew', label:'噛む・飲み込む',
   qs:'噛むことや、飲み込むことに困ることはありますか？', qf:'患者さんは、噛むことや飲み込むことに困ることはありますか？',
   opts:[{v:'none',t:'ない',cls:''},{v:'mild',t:'少しある',cls:'o2'},{v:'clear',t:'はっきりある',cls:'o3'}]}
];
var NUT_EXT = [

  });

  ADL_CORE.forEach(function(it,i){ FLOW.push({kind:'choice', item:it, store:'raw', sec:'普段の生活の動作について', pos:[i,3], opts:it.opts||OPT3, cond:mNotShort}); });
  ADL_EXT.forEach(function(it,i){ FLOW.push({kind:'choice', item:it, store:'raw', sec:'生活の動作（つづき）', pos:[i,3], opts:it.opts||OPT3, cond:mDetail}); });

  IADL_EXT.forEach(function(it,i){ FLOW.push({kind:'choice', item:it, store:'raw', sec:'日常の用事（つづき）', pos:[i,4], opts:OPT3I, iadl:true, cond:mDetail}); });

  FLOW.push({kind:'cogmulti', sec:'もの忘れについて', pos:[0,1],
    cond:function(){ return mDetail() || (mNotShort() && triageFlag('cog')); }});
  FLOW.push({kind:'mc_intro',  cond:mDetail});

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function speak(text){
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function qText(it){ return (S.mode==='family') ? (it.qf||it.qs) : it.qs; }
function quarterStr(d){ return d.getFullYear() + 'Q' + (Math.floor(d.getMonth()/3)+1); }
function go(i){ S.hist.push(S.idx); S.idx = i; render(); window.scrollTo(0,0); }
function next(){
  var i = S.idx + 1;
  while(i < FLOW.length-1 && FLOW[i].cond && !FLOW[i].cond()) i++;
  go(i);
}
function back(){
  if(S.hist.length){ S.idx = S.hist.pop(); render(); window.scrollTo(0,0); }
}

/* ---------------- 集計・2値化 ---------------- */
function bin(v){ return v===2 ? 1 : 0; }
function sumOf(items){ var s=0,n=0; items.forEach(function(it){ var v=S.raw[it.id]; if(v!=null){ s+=bin(v); n++; } }); return {sum:s, answered:n}; }
function adlSum(){ return sumOf(ALL_ADL); }
function iadlSum(){ return sumOf(ALL_IADL); }
function mcTotal(){
  if(S.mc.skipped || !S.mc.done) return null;
  return S.mc.recall.filter(Boolean).length + (S.mc.clock==null?0:S.mc.clock);
}
function drfSuspect(){
  var reasons = [];
  var real = S.acuteSymptoms.filter(function(x){return x!=='none';});
  if(real.length>0 && ['1w','2-4w','1-3m'].indexOf(S.acuteTiming)>=0){
    reasons.push('急性の機能低下：' + real.map(function(id){
      var f = ACUTE_SYMPTOMS.filter(function(a){return a.id===id;})[0];
      return f ? f.t : id;
    }).join('・') + '（' + timingLabel() + '）');
  }
  if(triageFlag('acute') && S.ext.ext_triage_q1==='yes'){
    reasons.push('発症前は身の回り自立（Q1）＋急な変化あり（Q6）→ 病勢由来の可能性が高い');
  }
  ALL_IADL.forEach(function(it){
    if(S.iadlReason[it.id]==='acute'){
      reasons.push('IADL「' + it.label + '」が病気になってから急に困難化');
    }
  });
  return reasons;
}
function timingLabel(){
  var f = ACUTE_TIMING.filter(function(t){return t.v===S.acuteTiming;})[0];
  return f ? f.t : '時期不明';
}
function optLabel(list, v){
  var f = (list||[]).filter(function(o){return o.v===v;})[0];
  return f ? f.t : (v==null ? '未回答' : String(v));
}

/* ---------------- アラート ---------------- */
function buildAlerts(){
  var A = [];
  function al(icon, text){ A.push({icon:icon, text:text}); }
  var a = adlSum(), i = iadlSum(), e = S.ext;
  if(a.answered>0 && a.sum < a.answered) al('🛁','ADLに介助項目あり（' + a.sum + '/' + a.answered + '聴取分）');
  if(i.answered>0 && i.sum < i.answered) al('🧺','IADLに介助・困難項目あり（' + i.sum + '/' + i.answered + '聴取分）');
  if(e.ext_nut_wtloss==='1-3kg' || e.ext_nut_wtloss==='3kg+') al('⚖️','体重減少あり → 栄養士介入・prehabilitation検討');
  if(e.ext_nut_intake==='half' || e.ext_nut_intake==='little' || e.ext_nut_intake==='varies') al('🍚','食事摂取低下の可能性');
  if(e.ext_nut_chew==='clear' || e.ext_nut_chew==='mild' || e.ext_nut_choke==='often' || e.ext_nut_choke==='sometimes') al('🥤','嚥下・咀嚼の懸念あり → 誤嚥リスク評価');
  if(e.ext_med_count==='5-9' || e.ext_med_count==='10+') al('💊','多剤併用（5剤以上）→ 薬剤師介入検討');
  if(e.ext_med_self==='not_managed') al('💊','服薬管理ができていない → 家族確認・薬剤師介入必要');
  if(e.ext_med_miss==='often') al('💊','飲み忘れが多い → 服薬支援検討');
  if(e.ext_med_access==='difficult') al('🚗','通院手段に課題 → 通院支援／初回入院導入検討');
  if(e.ext_med_fever==='difficult' || e.ext_med_fever==='unknown') al('🌡️','発熱時の緊急受診体制に不安 → FN対策・連絡手順の確認');
  if(e.ext_med_night==='no') al('🌙','夜間・休日に助けを呼べる人がいない');
  if(triageFlag('cog')) al('🧠','認知面の懸念（トリアージQ4）');
  var cogN = COG_MULTI.filter(function(c){return S.cogMulti[c.id];}).length;
  if(cogN>=2) al('🧠','認知関連の具体的エピソード ' + cogN + '項目 → 精査検討');
  var mct = mcTotal();
  if(mct!=null && mct<=2) al('🧠','Mini-Cog ' + mct + '/5点 → 認知機能低下の可能性');
  if(e.ext_soc_alone==='yes') al('🏠','独居');
  if(e.ext_soc_support==='no') al('🏠','治療・通院を支援できる人が不在 → MSW介入検討');
  if(e.ext_soc_emergency==='no') al('📞','緊急連絡先なし → 要確認');
  if(e.ext_soc_kaigo==='no' && (a.sum<a.answered || i.sum<i.answered)) al('📋','機能低下があるが介護保険未導入 → MSW介入検討');
  if(e.ext_soc_fall==='yes') al('🦶','自宅内転倒歴あり → 転倒リスク評価');
  if(drfSuspect().length) al('📈','病勢由来frailty疑い → prephase後の再評価を検討');
  TRIAGE.forEach(function(t,k){
    if(S.ext[t.id]==='unknown') al('❓','トリアージQ' + (k+1) + 'が「わからない」→ 医療者による確認必要');
  });
  return A;
}

/* ---------------- ペイロード（方式B） ---------------- */
function buildPayload(){
  var p = {
    research_id: S.researchId,
    submitted_quarter: quarterStr(new Date()),
    respondent_mode: S.mode,
    age_band: S.ageBand,
    triage_mode_auto: modeAuto(),
    triage_mode_final: modeFinal(),
    triage_mode_override: S.modeOverride,
    app_version: APP_VERSION
  };
  TRIAGE.forEach(function(t,k){
    p[t.id] = S.ext[t.id]!=null ? S.ext[t.id] : '';
    p['ext_triage_q' + (k+1) + '_flag'] = triageFlag(t.domain) ? 1 : 0;
  });
  ALL_ADL.forEach(function(it){
    var v = S.raw[it.id];
    p[it.id + '_raw'] = (v==null ? '' : v);
    p[it.id] = (v==null ? '' : bin(v));
  });
  ALL_IADL.forEach(function(it){
    var v = S.raw[it.id];
    p[it.id + '_raw'] = (v==null ? '' : v);
    p[it.id] = (v==null ? '' : bin(v));
    p['ext_' + it.id + '_reason'] = S.iadlReason[it.id] || '';
  });
  Object.keys(S.ext).forEach(function(k){ if(k.indexOf('ext_triage_')!==0) p[k] = S.ext[k]; });
  COG_MULTI.forEach(function(c){ p[c.id] = S.cogMulti[c.id] ? 1 : 0; });
  p.ext_acute_symptoms = S.acuteSymptoms.join(';');
  p.ext_acute_timing = S.acuteTiming || '';
  p.mc_done = S.mc.done ? 1 : 0;
  p.mc_skipped = S.mc.skipped ? 1 : 0;
  p.mc_wordset = S.mc.wordset || '';
  p.mc_recall = S.mc.done ? S.mc.recall.filter(Boolean).length : '';
  p.mc_clock = (S.mc.done && S.mc.clock!=null) ? S.mc.clock : '';
  p.mc_total = (mcTotal()==null ? '' : mcTotal());
  var a = adlSum(), i = iadlSum();
  p.adl_sum = a.sum; p.adl_answered = a.answered;
  p.iadl_sum = i.sum; p.iadl_answered = i.answered;
  p.drf_suspect_auto = drfSuspect().length ? 1 : 0;
  p.ext_staff_memo = S.staffMemo || '';
  p.alerts_auto = buildAlerts().map(function(x){return x.text;}).join(' / ');
  // ② 所要時間（全体＋画面ごと）。S.timingは変更せずスナップショットで算出（確認プレビューでも安全）
  var _tnow = Date.now();
  var _secs = {};
  Object.keys(S.timing.perSec).forEach(function(k){ _secs[k] = Math.round(S.timing.perSec[k]/1000); });
  if(S.timing.lastMs!=null && S.timing.lastKey!=null){
    _secs[S.timing.lastKey] = (_secs[S.timing.lastKey]||0) + Math.round((_tnow - S.timing.lastMs)/1000);
  }
  p.time_total_sec = S.timing.startMs ? Math.round((_tnow - S.timing.startMs)/1000) : '';
  p.ext_screen_times = JSON.stringify(_secs);
  return p;
}
function sendData(cb){
  var payload = buildPayload();
  if(!S.gasUrl){ cb(false, 'GAS URLが未設定です（設定画面で入力してください）'); return; }
  try{
    fetch(S.gasUrl, {method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain'}, body: JSON.stringify(payload)})
    .then(function(){ S.sent = true; cb(true, ''); })
    .catch(function(err){ cb(false, String(err)); });
  }catch(e){ cb(false, String(e)); }
}

function render(){
  // ② 画面ごとの滞在時間を加算（離れる画面に、前回入場からの経過を足す）
  var _now = Date.now();
  if(S.timing.lastMs!=null && S.timing.lastKey!=null){
    S.timing.perSec[S.timing.lastKey] = (S.timing.perSec[S.timing.lastKey]||0) + (_now - S.timing.lastMs);
  }
  var st = FLOW[S.idx];
  S.timing.lastKey = st.sec || st.kind;   // choice画面はセクション名、特殊画面はkindで集計
  S.timing.lastMs = _now;
  RENDERERS[st.kind](st);
}

function answerChoice(k, btn){

  if(st.store==='raw') S.raw[it.id] = o.v; else S.ext[it.id] = o.v;

                              : '「' + it.label + '」を普段されていないのは、なぜですか？';

    '<p class="qtext">' + esc(q) + '</p>';

    html += '<button class="btn ' + r.cls + sel + '" onclick="setIadlReason(\'' + it.id + '\',\'' + r.v + '\',this)">' +
      '<span class="num">' + (k+1) + '</span>' + esc(r.t) + '</button>';
  });
  html += '</div><div class="footer-nav"><button class="linkbtn" onclick="render()">← 前の質問にもどる</button></div>';

function setIadlReason(id, v, btn){
  S.iadlReason[id] = v;

}
function skipQ(){
  var st = FLOW[S.idx];
  if(st.item){
    if(st.store==='raw'){ delete S.raw[st.item.id]; } else { delete S.ext[st.item.id]; }
  }
  next();
}
function toggleCog(id){ S.cogMulti[id] = !S.cogMulti[id]; SKIP_ANIM = true; render(); }
function toggleAcute(id){
  SKIP_ANIM = true;
  if(id==='none'){ S.acuteSymptoms = (S.acuteSymptoms.indexOf('none')>=0) ? [] : ['none']; }
  else{
    var i = S.acuteSymptoms.indexOf(id);
    if(i>=0) S.acuteSymptoms.splice(i,1); else S.acuteSymptoms.push(id);
    var n = S.acuteSymptoms.indexOf('none');
    if(n>=0) S.acuteSymptoms.splice(n,1);
  }
  render();
}

/* --- 時計描画Canvas（ガイド線・数字候補・見本・自動補正なし） --- */
var CV = {ctx:null, drawing:false, hasInk:false};
function initClock(){
  var cv = document.getElementById('clockcv');
  var wrap = document.getElementById('clockwrap');
  var w = Math.min(wrap.clientWidth || 700, 760);
  var h = Math.min(Math.round(window.innerHeight*0.55), 560);
  var dpr = window.devicePixelRatio || 1;
  cv.width = w*dpr; cv.height = h*dpr;
  cv.style.width = w+'px'; cv.style.height = h+'px';
  var ctx = cv.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.lineWidth = 5;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#101040';
  CV.ctx = ctx; CV.cv = cv; CV.hasInk = false;
  function pos(ev){
    var r = cv.getBoundingClientRect();
    var p = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
    return {x: p.clientX - r.left, y: p.clientY - r.top};
  }
  function down(ev){ ev.preventDefault(); CV.drawing = true; CV.hasInk = true;
    var p = pos(ev); CV.ctx.beginPath(); CV.ctx.moveTo(p.x,p.y); CV.ctx.lineTo(p.x+0.1,p.y+0.1); CV.ctx.stroke(); }
  function move(ev){ if(!CV.drawing) return; ev.preventDefault();
    var p = pos(ev); CV.ctx.lineTo(p.x,p.y); CV.ctx.stroke(); }
  function up(ev){ CV.drawing = false; }
  cv.addEventListener('pointerdown', down);
  cv.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  var rb = document.getElementById('redoBtn');
  if(S.mc.redoUsed) rb.disabled = true;
}
function clockRedo(){
  if(S.mc.redoUsed) return;
  S.mc.redoUsed = true;
  var cv = CV.cv;
  CV.ctx.clearRect(0,0,cv.width,cv.height);
  CV.hasInk = false;
  document.getElementById('redoBtn').disabled = true;
}
function clockDone(){
  if(!CV.hasInk){
    if(!confirm('まだ何も描かれていません。このまま進みますか？')) return;
  }
  next();   // stroke・画像は保存しない
}

function togglePayload(){

function doSend(){

    if(ok){

    }else{
      m.innerHTML = '<div class="alert"><span class="ic">⚠️</span>送信できませんでした：' + esc(err) + '</div>';
    }
  });
}
function restartAll(){
  if(!confirm('回答をすべて消去して、新しい入力を開始しますか？（設定は保持されます）')) return;
  var keep = {gasUrl:S.gasUrl, staffCode:S.staffCode};

    ageBand:'', modeOverride:'auto', mode:null,
    raw:{}, iadlReason:{}, ext:{}, cogMulti:{},
    acuteSymptoms:[], acuteTiming:null,
    mc:{skipped:false, wordset:null, words:[], recall:[false,false,false], clock:null, redoUsed:false, done:false},
    staffMemo:'', idx:0, hist:[], sent:false,
    timing:{startMs:null, lastMs:null, lastKey:null, perSec:{}}};
  document.body.classList.remove('noanim');
  render();
}
